name: Go CI
on:
  - push
  - pull_request
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=5m
          version: v2.5.0
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}/go
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/deb-sig/double-entry-generator
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: ${{ env.GOPATH }}/src/github.com/deb-sig/double-entry-generator

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GOPATH }}/src/github.com/deb-sig/double-entry-generator/go.mod
          cache-dependency-path: ${{ env.GOPATH }}/src/github.com/deb-sig/double-entry-generator/go.sum

      - name: Check Go modules
        run: |
          go mod tidy && git add go.*
          git diff --cached --exit-code || (echo 'Please run "go mod tidy" to sync Go modules' && exit 1);
      - name: Install Ginkgo
        run: |
          # Use version from go.mod, not @latest
          go install github.com/onsi/ginkgo/v2/ginkgo
      - name: Verify gofmt
        run: |
          make check-format && make format && git add pkg
          git diff --cached --exit-code || (echo 'Please run "make format" to verify gofmt & goimports' && exit 1);
      - name: Run Integration test
        run: make test

      - name: Run Unit test
        run: ginkgo ./...
